<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09121d" />
    <meta name="description" content="Design and export podcast cover art with the Already Here Cover Grid." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Already Here Tools" />
    <meta property="og:title" content="Already Here Tools — Cover Grid" />
    <meta property="og:description" content="Design and export podcast cover art with the Already Here Cover Grid." />
    <meta property="og:url" content="https://alreadyhere.show/tools/layout/" />
    <meta property="og:image" content="https://alreadyhere.show/tools/layout/assets/already-here-tools-preview.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Already Here Tools Cover Grid preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Already Here Tools — Cover Grid" />
    <meta name="twitter:description" content="Design and export podcast cover art with the Already Here Cover Grid." />
    <meta name="twitter:image" content="https://alreadyhere.show/tools/layout/assets/already-here-tools-preview.jpg?v=2" />
    <title>Already Here Tools — Cover Grid</title>
    <link rel="stylesheet" href="styles.css?v=20260731-image-layer" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Already Here studio tool</p>
        <h1>Cover Grid</h1>
      </div>
      <div class="topbar-actions">
        <label class="button secondary">Load background<input id="backgroundFile" type="file" accept="image/*" hidden /></label>
        <button id="downloadProject" class="button secondary">Save layout JSON</button>
        <label class="button secondary">Load layout<input id="projectFile" type="file" accept="application/json" hidden /></label>
        <button id="exportJpg" class="button secondary">Export JPG</button>
        <button id="exportPng" class="button primary">Export PNG</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel layers-panel">
        <div class="panel-heading">
          <div><p class="eyebrow">Document</p><h2>Layers</h2></div>
          <button id="addLayer" class="icon-button" aria-label="Add text layer">+</button>
        </div>
        <div id="layerList" class="layer-list"></div>

        <section class="grid-controls">
          <div class="section-title">Alignment guides</div>
          <label><input id="showGrid" type="checkbox" checked /> Show guides</label>
          <label><input id="showColumns" type="checkbox" checked /> 12-column grid</label>
          <label><input id="showSafe" type="checkbox" checked /> Podcast safe area</label>
          <label><input id="showBounds" type="checkbox" checked /> Text bounds</label>
        </section>

        <nav class="sidebar-footer" aria-label="Cover Grid links">
          <a href="https://github.com/contains-studio/cover-grid" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
          <a href="https://www.youtube.com/@alreadyhereshow" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
          <a href="https://x.com/alreadyhereshow" target="_blank" rel="noopener noreferrer">X ↗</a>
          <a href="https://open.spotify.com/show/033YGqcUX3yaF2iNeMbOE8" target="_blank" rel="noopener noreferrer">Spotify ↗</a>
          <a href="https://podcasts.apple.com/us/podcast/already-here/id6796530206" target="_blank" rel="noopener noreferrer">Apple Podcasts ↗</a>
        </nav>
      </aside>

      <section class="stage-wrap">
        <div class="stage-toolbar">
          <span id="zoomLabel">Fit · 3000 × 3000</span>
          <label class="aspect-control">Canvas
            <select id="aspectRatio" aria-label="Canvas aspect ratio">
              <option value="1:1">Square · 1:1</option>
              <option value="16:9">Landscape · 16:9</option>
              <option value="4:5">Portrait · 4:5</option>
              <option value="9:16">Vertical · 9:16</option>
            </select>
          </label>
          <span class="hint">Drag text · Arrow keys nudge 1 px · Shift + arrow nudges 10 px</span>
        </div>
        <div class="stage-shell">
          <canvas id="coverCanvas" width="3000" height="3000"></canvas>
        </div>
      </section>

      <aside class="panel inspector-panel">
        <div class="panel-heading"><div><p class="eyebrow">Selected layer</p><h2 id="inspectorTitle">ALREADY</h2></div></div>
        <div id="inspector"></div>
        <section class="measure-card">
          <div class="section-title">Measured output</div>
          <dl id="measurements"></dl>
        </section>
      </aside>
    </main>

    <script type="module" src="app.js?v=20260731-image-layer"></script>
  </body>
</html>
